<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>8MetersPerSecond</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            background: black;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            overflow: hidden;
        }

        .bg {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #111 0%, #000 70%);
            z-index: 0;
        }

        .content {
            position: relative;
            z-index: 1;
            max-width: 900px;
            padding: 20px;
        }

        h1 {
            font-size: 64px;
            letter-spacing: 4px;
            margin: 0;
            text-transform: uppercase;
        }

        p {
            font-size: 18px;
            opacity: 0.8;
            margin-top: 20px;
            line-height: 1.6;
        }

        .btn {
            margin-top: 30px;
            display: inline-block;
            padding: 14px 28px;
            border: 1px solid white;
            color: white;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: 0.3s;
        }

        .btn:hover {
            background: white;
            color: black;
        }
    </style>
</head>

<body>
    <div class="bg"></div>

    <div class="content">
        <h1>8 METERS PER SECOND</h1>
        <p>
            Dominion of Cold<br>
        </p>

        <a class="btn" href="https://www.youtube.com/@8meterspersecondOfficial" target="_blank">
            Enter
        </a>
    </div>
</body>

</html>
